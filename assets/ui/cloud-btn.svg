<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="body" x1="160" y1="20" x2="160" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="48%" stop-color="#ffe7f3"/>
      <stop offset="100%" stop-color="#ffb3d6"/>
    </linearGradient>
    <radialGradient id="shine" cx="38%" cy="34%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx="55%" cy="78%" r="55%">
      <stop offset="0%" stop-color="#e56aa8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#d24a90" stop-opacity="0.28"/>
    </radialGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset in="blur" dy="6" result="off"/>
      <feFlood flood-color="#c44a88" flood-opacity="0.3" result="color"/>
      <feComposite in="color" in2="off" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#lift)">
    <!-- classic cloud silhouette -->
    <path fill="url(#body)" d="M78 94C54 94 36 78 38 62C20 58 16 36 38 30C44 12 70 4 92 16C106 4 130 0 152 12C170 2 198 4 216 20C238 10 268 18 276 40C298 42 312 60 304 78C314 92 298 108 274 104C264 116 234 122 202 118H112C92 124 70 110 78 94Z"/>
    <path fill="url(#shine)" d="M78 94C54 94 36 78 38 62C20 58 16 36 38 30C44 12 70 4 92 16C106 4 130 0 152 12C170 2 198 4 216 20C238 10 268 18 276 40C298 42 312 60 304 78C314 92 298 108 274 104C264 116 234 122 202 118H112C92 124 70 110 78 94Z"/>
    <path fill="url(#shade)" d="M78 94C54 94 36 78 38 62C20 58 16 36 38 30C44 12 70 4 92 16C106 4 130 0 152 12C170 2 198 4 216 20C238 10 268 18 276 40C298 42 312 60 304 78C314 92 298 108 274 104C264 116 234 122 202 118H112C92 124 70 110 78 94Z"/>
  </g>
</svg>
